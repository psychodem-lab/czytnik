<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistyczny Czytnik Wiadomości</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --text-main: #e3e6ed;
            --text-muted: #8892b0;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --border: #222530;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button.active, button:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            margin: 50px 0;
            font-size: 0.9rem;
            display: none;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        article {
            animation: fadeIn 0.4s ease forwards;
        }

        .article-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-title {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            font-weight: 500;
            line-height: 1.4;
        }

        .article-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .article-title a:hover {
            color: var(--accent-hover);
        }

        .article-description {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Wiadomości</h1>
            <nav>
                <button onclick="loadFeed('sciencedaily')" id="btn-sciencedaily" class="active">ScienceDaily</button>
                <button onclick="loadFeed('pap')" id="btn-pap">Polska</button>
                <button onclick="loadFeed('cnn')" id="btn-cnn">Świat</button>
                <button onclick="loadFeed('gazetaru')" id="btn-gazetaru">Ruskie</button>               
            </nav>
        </header>
        
        <div id="loader" class="loader">Wczytywanie artykułów z wielu źródeł...</div>
        <main id="feed" class="feed-container"></main>
    </div>

    <script>
        // TERAZ KAŻDE ŹRÓDŁO TO LISTA (TABLICA []). Możesz dopisać przecinek i kolejny link XML wewnątrz nawiasów kwadratowych.
        const feeds = {
            sciencedaily: [
                'https://www.sciencedaily.com/rss/all.xml'
            ],
            pap: [
                'https://pap-mediaroom.pl/kategoria/zdrowie-i-styl-zycia/rss.xml', 
                'https://pap-mediaroom.pl/kategoria/nauka-i-technologie/rss.xml',
                'https://pap-mediaroom.pl/kategoria/ludzie-i-kultura/rss.xml',
                'https://pap-mediaroom.pl/kategoria/polityka-i-społeczenstwo/rss.xml',
                'https://pap-mediaroom.pl/kategoria/biznes-i-finanse/rss.xml',
                'https://pap-mediaroom.pl/kalendarium/rss.xml',
                'https://rss.dw.com/xml/rss-pl-pol',
                'https://www.polsatnews.pl/rss/wszystkie.xml',  
                'https://www.rynekzdrowia.pl/Kanal/all.xml'
            ],
            cnn: [
                'http://feeds.bbci.co.uk/news/rss.xml',
                'https://www.reutersagency.com/feed/?best-topics=political-general-news&post_type=best'
            ],
            gazetaru: [
                'https://www.gazeta.ru/export/rss/first.xml'
            ]
        };

        // Funkcja pomocnicza zamieniająca nieregularne daty na znaczniki czasu (timestamp) do poprawnego sortowania chronologicznego
        function getTimestamp(dateStr) {
            if (!dateStr) return 0;
            
            // Obsługa formatu PAP: "pon., 06/01/2026 - 16:00"
            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    return new Date(`${match[3]}-${match[1]}-${match[2]}`).getTime();
                }
            }
            
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? 0 : d.getTime();
        }

        // Formatowanie daty do wyświetlenia użytkownikowi
        function parseFeedDate(dateStr) {
            if (!dateStr) return 'Brak daty';

            if (dateStr.includes('/')) {
                const match = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
                if (match) {
                    const dateObj = new Date(`${match[3]}-${match[1]}-${match[2]}`);
                    if (!isNaN(dateObj)) return formatDate(dateObj);
                }
            }

            const dateObj = new Date(dateStr);
            if (!isNaN(dateObj)) return formatDate(dateObj);

            return dateStr.replace(/^[a-złżóćęąśń.,\s]+/i, '');
        }

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        async function loadFeed(sourceKey) {
            const urls = feeds[sourceKey];
            const loader = document.getElementById('loader');
            const feedContainer = document.getElementById('feed');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${sourceKey}`).classList.add('active');

            loader.style.display = 'block';
            feedContainer.innerHTML = '';

            try {
                // Równoległe pobieranie wszystkich linków przypisanych do wybranego klucza
                const fetchPromises = urls.map(async (url) => {
                    try {
                        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                        if (!response.ok) return null;
                        const data = await response.json();
                        return data.status === 'ok' ? data.items : null;
                    } catch (e) {
                        return null; // Jeśli jeden z linków padnie, reszta i tak się załaduje
                    }
                });

                const results = await Promise.all(fetchPromises);
                
                // Łączenie wszystkich pobranych artykułów w jedną wspólną listę
                let combinedItems = [];
                results.forEach(items => {
                    if (items) combinedItems = combinedItems.concat(items);
                });

                loader.style.display = 'none';
                
                if (combinedItems.length === 0) {
                    feedContainer.innerHTML = '<p class="text-muted">Nie udało się wczytać żadnych artykułów.</p>';
                    return;
                }

                // KLUCZOWY MOMENT: Sortowanie wszystkich połączonych artykułów od najnowszego do najstarszego
                combinedItems.sort((a, b) => getTimestamp(b.pubDate) - getTimestamp(a.pubDate));

                // Renderowanie posortowanej listy
                combinedItems.forEach(item => {
                    const article = document.createElement('article');
                    const pubDate = parseFeedDate(item.pubDate);

                    let cleanDescription = item.description || '';
                    cleanDescription = cleanDescription.replace(/<[^>]*>/g, '').trim();

                    article.innerHTML = `
                        <div class="article-meta">${pubDate}</div>
                        <h2 class="article-title">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        </h2>
                        ${cleanDescription ? `<p class="article-description">${cleanDescription}</p>` : ''}
                    `;
                    feedContainer.appendChild(article);
                });

            } catch (error) {
                loader.style.display = 'none';
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        <p><strong>Wystąpił nieoczekiwany problem:</strong> ${error.message}</p>
                    </div>`;
            }
        }

        window.onload = () => {
            loadFeed('sciencedaily');
        };
    </script>
</body>
</html>
