<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistyczny Czytnik RSS</title>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #111111;
            --accent-color: #555555;
            --border-color: #eaeaea;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2.5rem;
            align-items: start;
        }

        .source-column {
            display: flex;
            flex-direction: column;
        }

        .source-title {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .feed-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .feed-item {
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }

        .feed-item a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .feed-item a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .meta {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 0.2rem;
        }

        .loading {
            font-size: 0.85rem;
            color: #999999;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Przegląd Wiadomości</h1>
    </header>

    <main class="grid">
        <section class="source-column">
            <div class="source-title">Science Daily</div>
            <ul class="feed-list" id="feed-sciencedaily"><span class="loading">Ładowanie...</span></ul>
        </section>

        <section class="source-column">
            <div class="source-title">CNN</div>
            <ul class="feed-list" id="feed-cnn"><span class="loading">Ładowanie...</span></ul>
        </section>

        <section class="source-column">
            <div class="source-title">KP.ru</div>
            <ul class="feed-list" id="feed-kp"><span class="loading">Ładowanie...</span></ul>
        </section>

        <section class="source-column">
            <div class="source-title">PAP.pl</div>
            <ul class="feed-list" id="feed-pap"><span class="loading">Ładowanie...</span></ul>
        </section>
    </main>

    <script>
        // Konfiguracja źródeł RSS
        const FEEDS = {
            sciencedaily: 'https://www.sciencedaily.com/rss/all.xml',
            cnn: 'http://rss.cnn.com/rss/edition.rss',
            kp: 'https://www.kp.ru/rss/rss.xml',
            pap: 'https://www.pap.pl/rss'
        };

        // Liczba wiadomości do pobrania z każdego źródła (ze względu na limity tłumacza ustawiono na 4)
        const ITEMS_LIMIT = 4;

        // Funkcja tłumacząca tekst za pomocą darmowego API MyMemory
        async function translateText(text, sourceLang = 'auto') {
            if (!text) return '';
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|pl`);
                const data = await response.json();
                if (data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return text; // Zwrot oryginału w przypadku braku tłumaczenia
            } catch (error) {
                console.error("Błąd tłumaczenia:", error);
                return text; // Zwrot oryginału w przypadku błędu sieci
            }
        }

        // Pobieranie i renderowanie pojedynczego kanału RSS
        async function fetchAndRenderFeed(id, url) {
            const container = document.getElementById(`feed-${id}`);
            // Wykorzystanie darmowego parsera rss2json, aby ominąć blokadę CORS
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Błąd pobierania danych');
                
                const data = await response.json();
                
                if (data.status !== 'ok' || !data.items || data.items.length === 0) {
                    container.innerHTML = '<li class="loading">Brak nowych wiadomości.</li>';
                    return;
                }

                container.innerHTML = ''; // Czyszczenie indykatora ładowania
                
                // Pobieranie tylko określonej liczby elementów
                const itemsToProcess = data.items.slice(0, ITEMS_LIMIT);

                for (const item of itemsToProcess) {
                    const li = document.createElement('li');
                    li.className = 'feed-item';
                    
                    // Wyświetlenie oryginalnego tytułu jako tymczasowego przed tłumaczeniem
                    li.innerHTML = `<a href="${item.link}" target="_blank" rel="noopener">${item.title}</a><div class="meta">Tłumaczenie...</div>`;
                    container.appendChild(li);

                    // Asynchroniczne tłumaczenie tytułu
                    translateText(item.title).then(translatedTitle => {
                        const linkElement = li.querySelector('a');
                        const metaElement = li.querySelector('.meta');
                        if (linkElement) linkElement.innerText = translatedTitle;
                        if (metaElement) metaElement.innerText = new Date(item.pubDate).toLocaleDateString('pl-PL');
                    });
                }

            } catch (error) {
                console.error(`Błąd podczas obsługi źródła ${id}:`, error);
                container.innerHTML = '<li class="loading">Nie udało się załadować wiadomości.</li>';
            }
        }

        // Inicjalizacja pobierania dla wszystkich zdefiniowanych stron
        function init() {
            Object.entries(FEEDS).forEach(([id, url]) => {
                fetchAndRenderFeed(id, url);
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
